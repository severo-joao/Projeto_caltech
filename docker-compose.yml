services:
  caltech-backend:
    build: ./backend
    container_name: caltech-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - /tmp/caltech_uploads:/tmp/caltech_uploads
    networks:
      - root_default

  caltech-frontend:
    image: nginx:alpine
    container_name: caltech-frontend
    restart: unless-stopped
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.caltech.rule=Host(`faturas.srv1122212.hstgr.cloud`)
      - traefik.http.routers.caltech.tls=true
      - traefik.http.routers.caltech.entrypoints=web,websecure
      - traefik.http.routers.caltech.tls.certresolver=mytlschallenge
      - traefik.http.services.caltech.loadbalancer.server.port=80
    networks:
      - root_default
    depends_on:
      - caltech-backend

networks:
  root_default:
    external: true
