services:
  backend:
    build: ./backend
    container_name: caltech-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    volumes:
      - /tmp/caltech_uploads:/tmp/caltech_uploads

  frontend:
    image: nginx:alpine
    container_name: caltech-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
